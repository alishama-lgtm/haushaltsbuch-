<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Unser Haushaltsbuch</title>
<meta name="description" content="Haushaltsbuch: Zahlungen, Fixkosten, Wochenbudget und Monatsplan. Alle Daten bleiben auf diesem Gerät.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#2b6a5e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Haushalt">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: eine schmale Handy-Spalte, Reiter als Chips, Karten nur für echte Einheiten (Zahlungen, Budgets, Plan) */
:root {
  --bg: #f1f3ee;
  --surface: #ffffff;
  --sunk: #f4f5f1;
  --ink: #16302a;
  --muted: #64716c;
  --line: #e1e5de;
  --accent: #2b6a5e;
  --accent-soft: #e4eee9;
  --on-accent: #ffffff;
  --danger: #b0472d;
  --danger-soft: #f8e9e4;
  --ok: #2d7a4c;
  --bar-a: #a9c3bb;
  --warn-bg: #fbf0e0;
  --warn-ink: #85561a;
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body: "Figtree", -apple-system, "Segoe UI", system-ui, sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1513; --surface: #15201d; --sunk: #1a2724; --ink: #e6eeeb; --muted: #97a6a0;
    --line: #26342f; --accent: #74bcac; --accent-soft: #1b302a; --on-accent: #0e1513;
    --danger: #e58b70; --danger-soft: #3a211b; --ok: #74c695; --bar-a: #3c5a52; --warn-bg: #33281a; --warn-ink: #e8bf86; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1513; --surface: #15201d; --sunk: #1a2724; --ink: #e6eeeb; --muted: #97a6a0;
  --line: #26342f; --accent: #74bcac; --accent-soft: #1b302a; --on-accent: #0e1513;
  --danger: #e58b70; --danger-soft: #3a211b; --ok: #74c695; --bar-a: #3c5a52; --warn-bg: #33281a; --warn-ink: #e8bf86; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; color-scheme: light; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
img { max-width: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.45; }
.wrap { max-width: 600px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 18px 40px; display: flex; flex-direction: column; gap: 18px; }
.num, .amt { font-variant-numeric: tabular-nums; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h1 { font-size: clamp(30px, 8vw, 40px); line-height: 1.05; }
h2 { font-size: 21px; }
h3 { font-size: 17px; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.danger { color: var(--danger); }
.ok { color: var(--ok); }

/* Kopf */
.head { display: flex; align-items: center; gap: 14px; }
.mark { width: 48px; height: 48px; border-radius: 13px; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-size: 18px; flex: none; }
.head .t { min-width: 0; }
.head h2 { font-size: 22px; }
nav.tabs { display: flex; flex-wrap: wrap; gap: 4px 6px; border-bottom: 1px solid var(--line); padding-bottom: 12px; }
nav.tabs a { text-decoration: none; color: var(--muted); padding: 8px 12px; border-radius: 10px; font-weight: 500; font-size: 16px; }
nav.tabs a[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
nav.tabs a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.bar-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.who { display: flex; align-items: center; gap: 10px; }
.sync { font-size: 14px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.sync::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.sync[data-s="ok"]::before { background: var(--ok); }
.sync[data-s="err"] { color: var(--danger); }
.sync[data-s="err"]::before { background: var(--danger); }

/* Formulare */
label.f { display: flex; flex-direction: column; gap: 6px; font-size: 15px; color: var(--ink); min-width: 0; }
input[type="text"], input[type="date"], input[type="number"], input:not([type]), select {
  font: inherit; font-size: 17px; color: var(--ink); background: var(--sunk); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; width: 100%; min-width: 0;
}
input.amt-in { text-align: right; }
select.mini { width: auto; padding: 8px 32px 8px 12px; font-size: 16px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 380px) { .grid2 { grid-template-columns: 1fr; } }
.check { display: flex; align-items: center; gap: 12px; cursor: pointer; }
.check input { width: 24px; height: 24px; accent-color: var(--accent); flex: none; margin: 0; }

/* Knöpfe */
button { font: inherit; cursor: pointer; }
.btn { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 12px; padding: 11px 16px; font-weight: 500; font-size: 16px; }
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.btn.wide { width: 100%; padding: 15px; font-size: 18px; display: flex; align-items: center; justify-content: center; gap: 10px; }
.btn.danger-btn { color: var(--danger); border-color: var(--danger); background: transparent; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.link { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 600; font-size: 16px; display: inline-flex; gap: 6px; align-items: center; text-decoration: none; }
.chip { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; font-size: 14px; color: var(--accent); background: var(--surface); }
.chip.on { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.chip.warn { color: var(--danger); border-color: var(--danger); }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }

/* Karten & Listen */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.card.hl { border-color: var(--accent); }
.card-h { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.rows { display: flex; flex-direction: column; }
.row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); min-width: 0; }
.rows > .row:first-child { border-top: 0; padding-top: 2px; }
.row .l { min-width: 0; flex: 1; display: flex; gap: 12px; align-items: center; }
.row .l .tx { min-width: 0; }
.row .tt { font-weight: 600; overflow-wrap: anywhere; }
.row .sub { font-size: 14px; color: var(--muted); }
.row .r { text-align: right; flex: none; }
.row.done .tt { text-decoration: line-through; color: var(--muted); }
.row.tap { cursor: pointer; }
.kv { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; }
.kv .k { color: var(--muted); }
.kv.total { border-top: 1px solid var(--line); padding-top: 12px; margin-top: 4px; font-weight: 700; }
.kv.total .k { color: var(--ink); }
.big { font-family: var(--font-display); font-size: clamp(40px, 12vw, 56px); line-height: 1; color: var(--accent); font-weight: 700; }
.big small { font-family: var(--font-body); font-size: 16px; color: var(--muted); font-weight: 400; }
.stats3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stats3 > div { min-width: 0; }
.stats3 .n { font-family: var(--font-display); font-size: clamp(17px, 5vw, 26px); font-weight: 700; white-space: nowrap; }
@media (max-width: 480px) {
  .stats3 { grid-template-columns: 1fr; gap: 0; }
  .stats3 > div { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 8px 0; border-top: 1px solid var(--line); }
  .stats3 > div:first-child { border-top: 0; }
  .stats3 .n { font-size: 20px; }
}
.prog { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
.prog > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.prog.over > i { background: var(--danger); }
.split { display: flex; height: 10px; border-radius: 99px; overflow: hidden; gap: 3px; }
.split i:first-child { background: var(--bar-a); }
.split i:last-child { background: var(--accent); }
.budget { display: flex; flex-direction: column; gap: 8px; padding: 14px 0; border-top: 1px solid var(--line); }
.budget:first-of-type { border-top: 0; padding-top: 0; }
.budget .top { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.budget .top .name { font-weight: 600; }
.budget .inp { display: flex; align-items: center; gap: 8px; }
.budget .inp input { width: 130px; }
.week { padding: 14px; border-radius: 12px; display: flex; justify-content: space-between; gap: 12px; }
.week.now { background: var(--accent-soft); }
.week .wn { font-family: var(--font-display); font-weight: 700; font-size: 18px; }
.week > div:first-child { flex: 1; }
.week .wa { font-family: var(--font-display); font-weight: 700; font-size: 20px; white-space: nowrap; }
.weeks { display: flex; flex-direction: column; gap: 2px; }
.weeks .week + .week:not(.now) { border-top: 1px solid var(--line); border-radius: 0; }
.empty { padding: 18px; border: 1px dashed var(--line); border-radius: 12px; color: var(--muted); text-align: center; }
.banner { padding: 14px 16px; border-radius: 12px; background: var(--danger-soft); color: var(--ink); font-size: 15px; }
.banner.info { background: var(--accent-soft); }
.banner.warn { background: var(--warn-bg); color: var(--warn-ink); display: flex; gap: 10px; align-items: flex-start; }
.banner.warn svg { flex: none; margin-top: 2px; }
.eyebrow { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.hero-n { font-family: var(--font-display); font-size: clamp(36px, 11vw, 52px); font-weight: 700; line-height: 1.08; }
.hero-n.acc { color: var(--accent); }
.btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.btn-grid .btn { display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; padding: 14px; font-size: 17px; }
.btn-grid .full { grid-column: 1 / -1; }
.cb { width: 24px; height: 24px; accent-color: var(--accent); flex: none; margin: 0; }
.cb-leer { width: 24px; flex: none; }
.fix-sum { display: flex; flex-direction: column; }
.fix-sum > div { padding: 12px 0; border-top: 1px solid var(--line); }
.fix-sum > div:first-child { border-top: 0; padding-top: 0; }
.fix-sum .n { font-family: var(--font-display); font-size: 30px; font-weight: 700; }
.vh { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; pointer-events: none; }
.foto-btn { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
.hbars { display: flex; flex-direction: column; gap: 10px; }
.hbar { display: grid; grid-template-columns: minmax(0, 7.5em) 1fr auto; gap: 10px; align-items: center; font-size: 15px; }
.hbar .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hbar .prog { height: 10px; }
.warn-text { color: var(--warn-ink); }
.q-status { font-size: 14px; color: var(--muted); }
.q-status.laeuft::before { content: ""; display: inline-block; width: 10px; height: 10px; margin-right: 8px; border-radius: 50%; border: 2px solid var(--accent); border-right-color: transparent; vertical-align: -1px; }
@media (prefers-reduced-motion: no-preference) { .q-status.laeuft::before { animation: dreh .8s linear infinite; } @keyframes dreh { to { transform: rotate(360deg); } } }
details.how summary { color: var(--accent); font-weight: 600; cursor: pointer; }
details.how .kv { font-size: 15px; }
.foot { display: flex; justify-content: space-between; gap: 10px; color: var(--muted); font-size: 14px; flex-wrap: wrap; }
.tag { font-size: 13px; padding: 2px 8px; border-radius: 6px; background: var(--sunk); color: var(--muted); white-space: nowrap; }
.months { display: flex; flex-wrap: wrap; gap: 8px; }

/* Blatt (Eingabefenster) */
.veil { position: fixed; inset: 0; background: rgba(10, 20, 17, .45); z-index: 30; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--surface); width: 100%; max-width: 600px; max-height: 92vh; overflow-y: auto; border-radius: 18px 18px 0 0; padding: 20px max(18px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 14px; }
@media (min-width: 640px) { .veil { align-items: center; } .sheet { border-radius: 18px; } }
.seg { display: flex; gap: 6px; flex-wrap: wrap; }
.seg button { border: 1px solid var(--line); background: var(--sunk); color: var(--ink); border-radius: 10px; padding: 9px 14px; font-size: 16px; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 12px 18px; border-radius: 12px; z-index: 40; font-size: 15px; max-width: calc(100% - 32px); }
@media (prefers-reduced-motion: no-preference) { .sheet { animation: up .18s ease-out; } @keyframes up { from { transform: translateY(16px); opacity: .6; } } }
</style>
</head>
<body>
<div class="wrap">
  <header class="head">
    <div class="mark" id="mark">a.</div>
    <div class="t"><h2>Unser Haushaltsbuch</h2><p class="muted" id="paar">Gemeinsam</p></div>
  </header>
  <nav class="tabs" id="tabs" aria-label="Bereiche">
    <a href="#uebersicht">Übersicht</a><a href="#monate">Monate</a><a href="#zahlungen">Zahlungen</a><a href="#fixkosten">Fixkosten</a><a href="#budgets">Budgets</a><a href="#verlauf">Verlauf</a><a href="#einstellungen">Einstellungen</a>
  </nav>
  <div class="bar-row">
    <label class="who" for="von-wahl"><span>Erfasst von</span>
      <select id="von-wahl" class="mini"><option value="p1">Person 1</option><option value="p2">Person 2</option></select>
    </label>
    <span class="sync" id="sync">Lade …</span>
  </div>
  <main id="main" style="display:flex;flex-direction:column;gap:18px">
    <div class="card"><h3>Haushaltsbuch wird geladen …</h3><p class="muted">Hier erscheinen gleich eure Zahlungen, Einnahmen, Budgets und der Monatsplan.</p>
      <noscript><div class="banner">JavaScript ist ausgeschaltet. Bitte die Seite in Safari oder Chrome öffnen.</div></noscript></div>
  </main>
  <footer class="foot"><span>Gespeichert nur auf diesem Gerät · Version 3</span><span id="gespeichert">—</span></footer>
</div>
<div id="veil" class="veil" hidden></div>
<div id="toast" class="toast" hidden></div>

<script>
'use strict';
/* ───────── Grundwerte ───────── */
const TABS = ['uebersicht','monate','zahlungen','fixkosten','budgets','verlauf','einstellungen'];
const KATEGORIEN = ['Wohnen','Energie','Versicherung','Mobilität','Kredit','Handy & Internet','Abos','Sonstiges'];
const RHYTHMUS = { 1: 'monatlich', 2: 'alle 2 Monate', 3: 'alle 3 Monate', 6: 'halbjährlich', 12: 'jährlich' };
const STD_BEREICHE = [
  { id: 'lebensmittel', name: 'Lebensmittel & Haushalt', ausWoche: true, budget: 0, pos: 1 },
  { id: 'sonstiges', name: 'Sonstiges / Puffer', budget: 0, pos: 2 },
];
const S = {
  db: null, user: null, downloads: null,
  verfuegbar: null,           // null = noch unklar, false = kein Speicher in dieser Ansicht
  nurLesen: false,
  einst: null, buchungen: [], fix: [], bereiche: [], zyklen: [],
  geladen: { einst: false, buchungen: false, fix: false, bereiche: false, zyklen: false },
  mitErwartet: true, monat: null, renderOffen: false,
  sample: null, bildOk: false, bildTypen: 'image/*',
  schnell: null, offenerBereich: null, importVorschau: null, importFehler: '',
};
const schnellLeer = () => ({ betrag: '', titel: '', bereich: 'lebensmittel', quelle: 'konto', datum: null, status: '', laeuft: false });
S.schnell = schnellLeer();

/* ───────── Helfer ───────── */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const EUR = new Intl.NumberFormat('de-AT', { style: 'currency', currency: 'EUR' });
const r2 = n => Math.round((Number(n) || 0) * 100) / 100;
const eur = n => EUR.format(Math.abs(r2(n))).replace('-', '');
const eurS = n => (r2(n) < 0 ? '− ' : '') + eur(n);
const eurOderStrich = n => (n == null || !isFinite(n)) ? '—' : eurS(n);
const summe = (arr, f = b => b.betrag) => r2(arr.reduce((s, x) => s + (Number(f(x)) || 0), 0));
function parseEuro(s) {
  if (s == null) return NaN;
  let t = String(s).replace(/[€\s]/g, '').replace('−', '-');
  if (!t) return NaN;
  if (t.includes(',')) t = t.replace(/\./g, '').replace(',', '.');
  const n = Number(t);
  return isFinite(n) ? r2(n) : NaN;
}
const amtIn = n => (n == null || n === '') ? '' : String(r2(n)).replace('.', ',');
function lsGet(k) { try { return localStorage.getItem(k); } catch { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch {} }

/* Datum: immer lokale Kalendertage als 'JJJJ-MM-TT' */
const pad = n => String(n).padStart(2, '0');
const isoTag = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const ausIso = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d, 12); };
const heute = () => isoTag(new Date());
const plusTage = (s, n) => { const d = ausIso(s); d.setDate(d.getDate() + n); return isoTag(d); };
const tageZwischen = (a, b) => Math.round((ausIso(b) - ausIso(a)) / 86400000);
const tm = s => s ? `${s.slice(8, 10)}.${s.slice(5, 7)}.` : '—';
const tmj = s => s ? `${s.slice(8, 10)}.${s.slice(5, 7)}.${s.slice(0, 4)}` : '—';
const MONATE = ['Jänner','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const monatName = ym => `${MONATE[Number(ym.slice(5, 7)) - 1]} ${ym.slice(0, 4)}`;
const MONAT_RE = new RegExp('\\b(' + [...MONATE, 'Januar', 'Feber'].join('|') + ')\\b', 'g');
function plusMonat(iso) {
  const [y, m, d] = iso.split('-').map(Number);
  const ny = m === 12 ? y + 1 : y, nm = m === 12 ? 1 : m + 1;
  return `${ny}-${pad(nm)}-${pad(Math.min(d, tageImMonat(ny, nm)))}`;
}
const tageImMonat = (y, m) => new Date(y, m, 0).getDate();
function zeitpunkt(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  return `${pad(d.getDate())}.${pad(d.getMonth() + 1)}., ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function faellig(datum) {
  const t = tageZwischen(heute(), datum);
  if (t === 0) return 'heute';
  if (t === 1) return 'morgen';
  if (t > 1) return `in ${t} Tagen`;
  return t === -1 ? 'seit gestern fällig' : `seit ${-t} Tagen fällig`;
}

/* ───────── Einstellungen mit Standardwerten ───────── */
function einst() {
  const e = S.einst || {};
  const von = e.zyklus?.von || heute();
  let bis = e.zyklus?.bis;
  if (!bis) { const d = ausIso(von); d.setMonth(d.getMonth() + 1); d.setDate(d.getDate() - 1); bis = isoTag(d); }
  return {
    namen: { p1: e.namen?.p1 || 'Person 1', p2: e.namen?.p2 || 'Person 2' },
    zyklus: { von, bis },
    sparziel: Number(e.sparziel) || 0,
    gespartVorher: Number(e.gespartVorher) || 0,
    sparbetrag: Number(e.sparbetrag) || 0,
    sparUeberwiesen: !!e.sparUeberwiesen,
    sparAm: e.sparAm || null,
    wochenbudget: Number(e.wochenbudget) || 0,
    abgleich: e.abgleich || null,
    letzteSicherung: e.letzteSicherung || null,
  };
}
function bereiche() {
  const map = new Map(STD_BEREICHE.map(b => [b.id, { ...b }]));
  for (const b of S.bereiche) map.set(b.id, { ...(map.get(b.id) || {}), ...b });
  return [...map.values()].filter(b => !b.geloescht).sort((a, b) => (a.pos ?? 99) - (b.pos ?? 99));
}

/* ───────── Wochen im Zyklus (Mo–So, an den Zyklus geschnitten) ───────── */
function wochen(E) {
  const out = []; let start = E.zyklus.von; let nr = 1;
  if (E.zyklus.bis < start) return out;
  while (start <= E.zyklus.bis) {
    const wt = ausIso(start).getDay();             // 0 = Sonntag
    let ende = plusTage(start, wt === 0 ? 0 : 7 - wt);
    if (ende > E.zyklus.bis) ende = E.zyklus.bis;
    const tage = tageZwischen(start, ende) + 1;
    out.push({ nr: nr++, von: start, bis: ende, tage, betrag: r2(E.wochenbudget * tage / 7) });
    start = plusTage(ende, 1);
    if (nr > 60) break;
  }
  return out;
}

/* ───────── Die eine Rechnung, aus der alle Ansichten lesen ───────── */
function rechnen() {
  const E = einst(); const z = E.zyklus;
  const inZ = b => b.datum >= z.von && b.datum <= z.bis;
  const ein = S.buchungen.filter(b => b.art === 'einnahme' && inZ(b));
  const zah = S.buchungen.filter(b => b.art === 'zahlung' && inZ(b));
  const aus = S.buchungen.filter(b => b.art === 'ausgabe' && inZ(b));
  const R = {
    E, ein, zah, aus,
    einGesamt: summe(ein), einErhalten: summe(ein.filter(b => b.erledigt)),
    zahGesamt: summe(zah), zahBezahlt: summe(zah.filter(b => b.erledigt)),
    alltag: summe(aus),
    spar: r2(E.sparbetrag), sparErledigt: E.sparUeberwiesen ? r2(E.sparbetrag) : 0,
  };
  R.einOffen = r2(R.einGesamt - R.einErhalten);
  R.zahOffen = r2(R.zahGesamt - R.zahBezahlt);
  R.sparOffen = r2(R.spar - R.sparErledigt);

  // Konto & Bargeld jetzt = letzter Abgleich + alles, was danach erledigt wurde
  R.konto = null; R.bar = null; R.jetzt = null;
  const a = E.abgleich;
  if (a && a.am) {
    let k = Number(a.konto) || 0, c = Number(a.bar) || 0;
    for (const b of S.buchungen) {
      if (!b.erledigt || !b.erledigtAm || b.erledigtAm <= a.am) continue;
      const v = (b.art === 'einnahme' ? 1 : -1) * (Number(b.betrag) || 0);
      if (b.quelle === 'bar') c += v; else k += v;
    }
    if (E.sparUeberwiesen && E.sparAm && E.sparAm > a.am) k -= E.sparbetrag;
    R.konto = r2(k); R.bar = r2(c); R.jetzt = r2(k + c);
  }
  // Geld zu Zyklusbeginn: so viel war da, bevor die erledigten Buchungen dieses Zyklus liefen
  R.start = R.jetzt == null ? null : r2(R.jetzt - R.einErhalten + R.zahBezahlt + R.alltag + R.sparErledigt);
  R.uebrig = R.start == null ? null : r2(R.einGesamt - R.zahGesamt - R.alltag - R.spar + R.start);
  R.uebrigOhne = R.jetzt == null ? null : r2(R.jetzt - R.zahOffen - R.sparOffen);

  // Budgets
  R.wochen = wochen(E);
  R.bereiche = bereiche().map(b => {
    const budget = b.ausWoche ? summe(R.wochen) : r2(b.budget);
    const ausgegeben = summe(aus.filter(x => (x.bereich || 'sonstiges') === b.id));
    return { ...b, budget, ausgegeben, frei: r2(budget - ausgegeben) };
  });
  const bekannte = new Set(R.bereiche.map(b => b.id));
  R.ohneBereich = summe(aus.filter(x => !bekannte.has(x.bereich || 'sonstiges')));
  R.budgetGesamt = summe(R.bereiche, b => b.budget);
  R.budgetRest = summe(R.bereiche, b => Math.max(0, b.frei));
  const basis = S.mitErwartet ? R.uebrig : R.uebrigOhne;
  R.puffer = basis == null ? null : r2(basis - R.budgetRest);
  const t = heute();
  const lm = R.bereiche.find(b => b.ausWoche);
  R.wochen.forEach(w => {
    w.ausgegeben = lm ? summe(aus.filter(x => (x.bereich || 'sonstiges') === lm.id && x.datum >= w.von && x.datum <= w.bis)) : 0;
    w.rest = r2(w.betrag - w.ausgegeben);
    w.jetzt = t >= w.von && t <= w.bis;
    w.vorbei = t > w.bis;
    w.nochTage = w.jetzt ? tageZwischen(t, w.bis) + 1 : (w.vorbei ? 0 : w.tage);
  });
  R.dieseWoche = R.wochen.find(w => w.jetzt) || null;
  return R;
}

/* Fixkosten: wann ist eine Fixkosten-Zeile im Zyklus fällig? */
function faelligkeiten(f, E) {
  const out = []; const r = Number(f.rhythmus) || 1;
  const [sy, sm] = (f.startMonat || E.zyklus.von.slice(0, 7)).split('-').map(Number);
  let d = ausIso(E.zyklus.von.slice(0, 8) + '01');
  const ende = E.zyklus.bis;
  for (let i = 0; i < 14; i++) {
    const y = d.getFullYear(), m = d.getMonth() + 1;
    const diff = (y - sy) * 12 + (m - sm);
    if (diff >= 0 && diff % r === 0) {
      const tag = Math.min(Number(f.tag) || 1, tageImMonat(y, m));
      const datum = `${y}-${pad(m)}-${pad(tag)}`;
      if (datum >= E.zyklus.von && datum <= ende) out.push(datum);
    }
    d.setMonth(d.getMonth() + 1);
    if (isoTag(d) > ende) break;
  }
  return out;
}

/* Schon als Zahlung da? Gleiche Fixkosten-Zeile, oder gleicher Name am selben Tag (von Hand eingetragen) */
const gleicherName = (a, b) => String(a || '').trim().toLowerCase() === String(b || '').trim().toLowerCase();
function fixStand(f, E) {
  const z = E.zyklus;
  const dats = f.aktiv === false ? [] : faelligkeiten(f, E);
  const linked = S.buchungen.filter(b => b.art === 'zahlung' && b.datum >= z.von && b.datum <= z.bis && (b.fixId === f.id || (!b.fixId && gleicherName(b.titel, f.titel)))).sort((a, b) => a.datum.localeCompare(b.datum));
  const freiDats = dats.filter(d => !linked.some(b => b.datum === d));
  const freiLinked = linked.filter(b => !dats.includes(b.datum));
  return { dats, linked, fehlend: freiDats.slice(freiLinked.length) };
}

function uebersicht(R, kopf) {
  const E = R.E;
  const offen = R.zah.filter(b => !b.erledigt).sort((a, b) => a.datum.localeCompare(b.datum));
  const bezahlt = R.zah.filter(b => b.erledigt).sort((a, b) => b.datum.localeCompare(a.datum));
  const jm = heute().slice(0, 7);
  const knoepfe = `<div class="btn-grid"><a class="btn" href="#fixkosten">Fixkosten</a>${S.nurLesen ? '<span></span>' : `<button class="btn primary" data-a="neu" data-art="ausgabe"><span aria-hidden="true" style="font-size:22px;line-height:1">+</span> Ausgabe</button>`}<a class="btn full" href="#monate">Monatsübersicht ansehen</a></div><p class="small muted">${monatName(jm)} ist aktuell · noch ${Math.max(0, tageZwischen(heute(), E.zyklus.bis) + 1)} Tage bis ${tm(E.zyklus.bis)}</p>`;
  return kopf('Dein Geld. Klar im Blick.', `${tm(E.zyklus.von)} – ${tmj(E.zyklus.bis)}`, knoepfe) + `
  <div class="card hl">
    <div><div class="eyebrow">Konto &amp; Bar · jetzt vorhanden</div><div class="hero-n amt">${eurOderStrich(R.jetzt)}</div>
      ${R.jetzt == null ? `<p class="small">Noch kein Kontostand eingetragen. <a class="link" href="#einstellungen">Einstellungen → Abgleichen</a></p>` : `<p class="small muted amt">${eur(R.konto)} Konto · ${eur(R.bar)} bar</p>`}</div>
    <div style="border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:6px"><div class="eyebrow">Nach offenen Zahlungen übrig</div>
      <div class="hero-n acc amt ${R.uebrig != null && R.uebrig < 0 ? 'danger' : ''}">${eurOderStrich(R.uebrig)}</div>
      ${R.uebrig == null ? '' : `<p class="small muted amt">${eur(R.jetzt)} + ${eur(R.einOffen)} erwartet − ${eur(R.zahOffen)} Zahlungen − ${eur(R.sparOffen)} Sparen</p>
      <p class="small muted">Im Plan übrig bis ${tm(E.zyklus.bis)}${R.einOffen > 0 ? ' Erwartete Einnahmen sind einbezogen.' : ''} Für Alltag &amp; Puffer sind davon ${eur(R.budgetRest)} eingeplant.</p>`}</div>
  </div>
  ${faelligHinweis(R)}
  ${erwartetHinweis(R)}
  ${schnellKarte(R)}
  <div class="card"><div class="card-h"><h2>Deine nächsten Zahlungen</h2><span class="muted small">${offen.length} offen</span></div>
    <div class="rows">${offen.length + bezahlt.length ? [...offen, ...bezahlt.slice(0, 2)].map(b => zahlungZeile(b)).join('') : '<p class="muted">Keine Zahlungen in diesem Zyklus. Unter <a class="link" href="#fixkosten">Fixkosten</a> legst du feste Zahlungen einmal an.</p>'}</div>
    <a class="link" href="#zahlungen">Alle Details →</a></div>
  <div class="card"><div class="card-h"><h2>Einnahmen</h2><span class="muted small amt">${eur(R.einOffen)} erwartet</span></div>
    <div class="rows">${R.ein.length ? R.ein.sort((a, b) => a.datum.localeCompare(b.datum)).map(b => `
      <div class="row tap" data-a="bearbeiten" data-id="${esc(b.id)}" role="button" tabindex="0"><div class="l"><div class="tx"><div class="tt">${esc(b.titel)}</div><div class="sub">${tm(b.datum)} · ${b.quelle === 'bar' ? 'Bar' : 'Konto'}</div></div></div>
        <div class="r"><div class="amt"><b>${eur(b.betrag)}</b></div><div class="sub ${b.erledigt ? 'ok' : ''}">${b.erledigt ? 'Eingegangen' : 'Noch erwartet'}</div></div></div>
      ${b.vomVormonat && !b.erledigt ? `<p class="small warn-text" style="padding-bottom:8px">Betrag vom Vormonat. Antippen und mit dem Lohnzettel vergleichen.</p>` : ''}
      ${b.erledigt ? '' : `<label class="check small" style="padding-bottom:10px"><input type="checkbox" data-a="erledigt" data-id="${esc(b.id)}" ${S.nurLesen ? 'disabled' : ''}><span>${esc(b.titel)} ist eingegangen</span></label>`}`).join('') : '<p class="muted">Noch keine Einnahme eingetragen.</p>'}</div>
    ${S.nurLesen ? '' : `<div><button class="btn" data-a="neu" data-art="einnahme">+ Einnahme hinzufügen</button></div>`}</div>
  <div class="card"><div class="card-h"><h2>Deine Alltagsbudgets</h2><span class="muted small amt">${eur(R.alltag)} genutzt</span></div>
    <div>${budgetListe(R, false)}</div><a class="link" href="#budgets">Budgets anpassen →</a></div>
  ${monatsplan(R)}`;
}

function monate(R, kopf) {
  const E = R.E; const t = heute(); const jm = t.slice(0, 7);
  const set = new Set();
  let d = ausIso(E.zyklus.von.slice(0, 8) + '01');
  while (isoTag(d).slice(0, 7) <= E.zyklus.bis.slice(0, 7)) { set.add(isoTag(d).slice(0, 7)); d.setMonth(d.getMonth() + 1); }
  S.buchungen.forEach(b => b.datum && set.add(b.datum.slice(0, 7)));
  const liste = [...set].sort();
  if (!S.monat || !set.has(S.monat)) S.monat = set.has(jm) ? jm : liste[liste.length - 1];
  const karte = ym => {
    const bs = S.buchungen.filter(b => b.datum && b.datum.slice(0, 7) === ym);
    const ein = bs.filter(b => b.art === 'einnahme'), zah = bs.filter(b => b.art === 'zahlung'), aus = bs.filter(b => b.art === 'ausgabe');
    const erh = summe(ein.filter(b => b.erledigt)), erw = summe(ein.filter(b => !b.erledigt));
    const bez = summe(zah.filter(b => b.erledigt)), off = summe(zah.filter(b => !b.erledigt)), all = summe(aus);
    const diff = r2(erh - bez - all);
    const status = ym === jm ? 'Aktuell' : ym > jm ? 'Geplant' : 'Vergangen';
    return `<div class="card ${ym === S.monat ? 'hl' : ''}"><div class="card-h"><h2>${monatName(ym)}</h2><span class="chip">${status}</span></div>
      <p class="small muted">Buchungen nach Datum im Kalendermonat</p>
      <div><div class="kv"><span class="k">Einnahmen erhalten</span><b class="amt">${eur(erh)}</b></div>
      ${erw ? `<div class="kv"><span class="k">Einnahmen erwartet</span><span class="amt">${eur(erw)}</span></div>` : ''}
      <div class="kv"><span class="k">Zahlungen bezahlt</span><span class="amt">${eur(bez)}</span></div>
      <div class="kv"><span class="k">Alltagsausgaben</span><span class="amt">${eur(all)}</span></div>
      <div class="kv"><span class="k">Zahlungen noch offen</span><b class="amt ${off ? 'danger' : ''}">${eur(off)}</b></div>
      <div class="kv total"><span class="k">Differenz der Einträge</span><span class="amt ${diff < 0 ? 'danger' : ''}">${eurS(diff)}</span></div></div>
      <p class="small muted">${bs.length} erfasste Buchung${bs.length === 1 ? '' : 'en'} · Einnahmen erhalten minus bezahlte Zahlungen und Alltagsausgaben.</p>
      ${ym === S.monat ? '<p class="small muted">Die Einträge stehen unten.</p>' : `<div><button class="btn" data-a="monat" data-m="${ym}">Einträge ansehen</button></div>`}</div>`;
  };
  const eintr = S.buchungen.filter(b => b.datum && b.datum.slice(0, 7) === S.monat).sort((a, b) => a.datum.localeCompare(b.datum));
  const artText = { einnahme: 'Einnahme', zahlung: 'Zahlung', ausgabe: 'Alltag' };
  const statusText = b => b.art === 'einnahme' ? (b.erledigt ? 'Erhalten' : 'Erwartet') : b.art === 'zahlung' ? (b.erledigt ? 'Bezahlt' : 'Offen') : (bereiche().find(x => x.id === b.bereich)?.name || 'Alltag');
  return kopf('Eure Monate im Überblick.', `Abgeschlossene Monate und aktuelle Buchungen · Gehaltszeitraum ${tmj(E.zyklus.von)} – ${tmj(E.zyklus.bis)}`) + `
  <div class="card"><div class="card-h"><h3>Aktueller Stand · ${tm(t)}</h3><span class="muted small">${esc(E.namen.p1)} &amp; ${esc(E.namen.p2)}</span></div>
    <div class="stats3"><div><div class="muted small">Konto jetzt</div><div class="n amt">${eurOderStrich(R.konto)}</div></div>
    <div><div class="muted small">Bargeld jetzt</div><div class="n amt">${eurOderStrich(R.bar)}</div></div>
    <div><div class="muted small">Zusammen</div><div class="n amt">${eurOderStrich(R.jetzt)}</div></div></div>
    ${E.abgleich ? `<p class="small muted">Zuletzt abgeglichen ${zeitpunkt(E.abgleich.am)}, seither mit allen erledigten Buchungen fortgerechnet.</p>` : `<p class="small">Noch kein Kontostand. <a class="link" href="#einstellungen">Einstellungen → Abgleichen</a></p>`}</div>
  <div class="months">${liste.map(ym => `<button class="chip ${ym === S.monat ? 'on' : ''}" data-a="monat" data-m="${ym}">${monatName(ym)}${ym === jm ? ' · Aktuell' : ''}</button>`).join('')}</div>
  ${S.nurLesen ? '' : `<div><button class="btn" data-a="neu-zyklus">Abgeschlossenen Monat hinzufügen</button></div>`}
  ${liste.map(karte).join('')}
  <p class="small muted">Die laufenden Buchungen sind nach Datum zusammengefasst. Kontostand-Abgleiche sind in der Differenz nicht enthalten.</p>
  <div class="card"><div class="card-h"><h2>Einträge · ${monatName(S.monat)}</h2></div>
    <div class="rows">${eintr.length ? eintr.map(b => `<div class="row tap" data-a="bearbeiten" data-id="${esc(b.id)}" role="button" tabindex="0"><div class="l"><div class="tx"><div class="tt">${esc(b.titel)}</div><div class="sub">${tm(b.datum)} · ${artText[b.art]}${b.von ? ' · ' + esc(name(b.von)) : ''}</div></div></div>
      <div class="r"><div class="amt"><b>${b.art === 'einnahme' ? '+ ' : '− '}${eur(b.betrag)}</b></div><div class="sub">${esc(statusText(b))}</div></div></div>`).join('') : '<p class="muted">Keine Einträge in diesem Monat.</p>'}</div></div>`;
}

function zahlungen(R, kopf) {
  const offen = R.zah.filter(b => !b.erledigt).sort((a, b) => a.datum.localeCompare(b.datum));
  const bez = R.zah.filter(b => b.erledigt).sort((a, b) => a.datum.localeCompare(b.datum));
  const spaet = offen.filter(b => b.datum < heute());
  const ausserhalb = S.buchungen.filter(b => b.art === 'zahlung' && !b.erledigt && b.datum > R.E.zyklus.bis).length;
  return kopf('Eure Zahlungen.', `Rechnungen und Einnahmen im Zyklus ${tmj(R.E.zyklus.von)} – ${tmj(R.E.zyklus.bis)}.`) + `
  ${S.nurLesen ? '' : `<div class="btn-row" style="justify-content:flex-start"><button class="btn" data-a="neu" data-art="zahlung">+ Zahlung</button><button class="btn" data-a="neu" data-art="einnahme">+ Einnahme</button></div>`}
  ${spaet.length ? `<div class="banner"><b>${spaet.length} Zahlung${spaet.length === 1 ? ' ist' : 'en sind'} überfällig</b> (${eur(summe(spaet))}). Wenn schon bezahlt: Häkchen setzen.</div>` : ''}
  <div class="card"><div class="card-h"><h2>Offen</h2><b class="amt danger">${eur(R.zahOffen)}</b></div>
    <div class="rows">${offen.length ? offen.map(b => zahlungZeile(b)).join('') : '<p class="muted">Alles bezahlt.</p>'}</div></div>
  <div class="card"><div class="card-h"><h2>Bezahlt</h2><b class="amt">${eur(R.zahBezahlt)}</b></div>
    <div class="rows">${bez.length ? bez.map(b => zahlungZeile(b)).join('') : '<p class="muted">Noch nichts bezahlt.</p>'}</div></div>
  <div class="card"><div class="card-h"><h2>Einnahmen</h2><b class="amt">${eur(R.einGesamt)}</b></div>
    <div class="rows">${R.ein.length ? R.ein.sort((a, b) => a.datum.localeCompare(b.datum)).map(b => zahlungZeile(b)).join('') : '<p class="muted">Noch keine Einnahme.</p>'}</div></div>
  ${ausserhalb ? `<p class="small muted">${ausserhalb} offene Zahlung${ausserhalb === 1 ? ' liegt' : 'en liegen'} nach dem ${tmj(R.E.zyklus.bis)} und zählt erst im nächsten Zyklus.</p>` : ''}`;
}

function fixkosten(R, kopf) {
  const E = R.E;
  const liste = [...S.fix].sort((a, b) => (Number(a.tag) || 0) - (Number(b.tag) || 0) || String(a.titel).localeCompare(String(b.titel)));
  const staende = liste.map(f => ({ f, st: fixStand(f, E) }));
  const angelegt = staende.flatMap(x => x.st.linked);
  const fehlend = staende.flatMap(x => x.st.fehlend.map(d => ({ f: x.f, d })));
  const bezahlt = summe(angelegt.filter(b => b.erledigt));
  const gesamt = r2(summe(angelegt) + summe(fehlend, x => x.f.betrag));
  const offen = r2(gesamt - bezahlt);
  const aktiv = S.fix.filter(f => f.aktiv !== false);
  const proKat = KATEGORIEN.map(k => ({ k, s: summe(aktiv.filter(f => (f.kategorie || 'Sonstiges') === k), f => (Number(f.betrag) || 0) / (Number(f.rhythmus) || 1)) })).filter(x => x.s > 0);
  const details = S.nurLesen ? '' : f => `<button class="link small" data-a="fix-bearbeiten" data-id="${esc(f.id)}">▸ Details bearbeiten</button>`;
  const zeile = (f, b, d) => {
    let hinweis, cls = '';
    if (b) { hinweis = b.erledigt ? 'Bezahlt' : `${tm(b.datum)} · ${faellig(b.datum)}`; if (!b.erledigt && b.datum < heute()) cls = 'danger'; }
    else if (d) { hinweis = `${tm(d)} · noch nicht übernommen`; cls = 'danger'; }
    else hinweis = f.aktiv === false ? 'pausiert' : `diesmal nicht fällig · ${RHYTHMUS[f.rhythmus] || 'monatlich'}`;
    return `<div class="row ${b && b.erledigt ? 'done' : ''}"><div class="l">
      ${b ? `<input type="checkbox" class="cb" aria-label="${esc(f.titel)} bezahlt" data-a="erledigt" data-id="${esc(b.id)}" ${b.erledigt ? 'checked' : ''} ${S.nurLesen ? 'disabled' : ''}>` : '<span class="cb-leer" aria-hidden="true"></span>'}
      <div class="tx"><div class="tt">${esc(f.titel)}</div><div class="sub ${cls}">${hinweis}</div>${details ? details(f) : ''}</div></div>
      <div class="r amt"><b>${eur(b ? b.betrag : f.betrag)}</b>${Number(f.rhythmus) > 1 ? `<div class="sub">${RHYTHMUS[f.rhythmus]}</div>` : ''}</div></div>`;
  };
  const zeilen = staende.map(({ f, st }) => {
    const teile = st.linked.map(b => zeile(f, b));
    st.fehlend.forEach(d => teile.push(zeile(f, null, d)));
    if (!teile.length) teile.push(zeile(f, null, null));
    return teile.join('');
  });
  const neuKnopf = S.nurLesen ? '' : `<button class="btn primary wide" data-a="fix-neu"><span aria-hidden="true" style="font-size:24px;line-height:1">+</span> Fixkosten hinzufügen</button>`;
  return kopf('Eure Fixkosten im Blick.', `Regelmäßige Zahlungen für ${tm(E.zyklus.von)} – ${tmj(E.zyklus.bis)}`, neuKnopf) + `
  <div class="card"><div class="fix-sum">
    <div><div class="muted">Fixkosten in diesem Haushaltsmonat</div><div class="n amt">${eur(gesamt)}</div></div>
    <div><div class="muted">Davon noch offen</div><div class="n amt ${offen > 0 ? 'danger' : ''}">${eur(offen)}</div></div>
    <div><div class="muted">Bereits bezahlt</div><div class="n amt">${eur(bezahlt)}</div></div></div>
    ${R.einGesamt > 0 && gesamt > 0 ? `<p class="small muted">Das sind ${Math.round(gesamt / R.einGesamt * 100)} % eurer Einnahmen in diesem Zyklus (${eur(R.einGesamt)}).</p>` : ''}
    ${proKat.length ? `<details class="how"><summary>Nach Art aufgeteilt (pro Monat)</summary><div style="padding-top:8px">${proKat.map(x => `<div class="kv"><span class="k">${esc(x.k)}</span><span class="amt">${eur(x.s)}</span></div>`).join('')}</div></details>` : ''}
  </div>
  ${fehlend.length && !S.nurLesen ? `<div class="banner info"><b>${fehlend.length} Fixkosten ${fehlend.length === 1 ? 'fehlt' : 'fehlen'} noch bei den Zahlungen</b> (${eur(summe(fehlend, x => x.f.betrag))}). <div style="padding-top:10px"><button class="btn primary" data-a="fix-uebernehmen">Jetzt übernehmen</button></div></div>` : ''}
  <div class="card"><div class="card-h"><h2>Eure monatlichen Fixkosten</h2><span class="muted small">${S.fix.length} Posten</span></div>
    <p class="small muted">Hier stehen eure regelmäßigen Kosten. Offene Beträge sind im Monatsplan berücksichtigt. Beim Abschluss des Zyklus werden sie für den nächsten Zyklus wieder übernommen.</p>
    <div class="rows">${zeilen.length ? zeilen.join('') : '<div class="empty">Noch keine Fixkosten. Leg zum Beispiel Miete, Strom, Versicherung oder Kredit einmal an, mit Betrag und Tag im Monat.</div>'}</div>
    ${S.nurLesen ? '' : `<div><button class="btn" data-a="fix-neu">+ Fixkosten hinzufügen</button></div>`}</div>`;
}

function budgets(R, kopf) {
  const E = R.E; const w = R.dieseWoche;
  const lm = R.bereiche.find(b => b.ausWoche);
  const basis = S.mitErwartet ? R.uebrig : R.uebrigOhne;
  let deckung = '';
  if (basis == null) deckung = '<p class="small danger">Ob das Budget gedeckt ist, sehe ich erst mit einem Kontostand: Einstellungen → Konto &amp; Bargeld → Abgleichen.</p>';
  else if (R.puffer >= 0) deckung = `<p class="small">${S.mitErwartet ? 'Das Wochenziel ist mit den erwarteten Eingängen gedeckt.' : 'Das Wochenziel ist mit dem Geld gedeckt, das schon da ist.'} Danach bleiben <b class="amt">${eur(R.puffer)}</b> als zusätzlicher Puffer.</p>`;
  else deckung = `<p class="small danger">${S.mitErwartet ? 'Auch mit den erwarteten Eingängen' : 'Mit dem Geld, das schon da ist,'} fehlen <b class="amt">${eur(-R.puffer)}</b> für alle Budgets.</p>`;
  return kopf('Platz für euren Alltag.', 'Eure Budgets und euer Sparbetrag.') + `
  ${erwartetHinweis(R)}
  <div class="card"><h2>Euer Einkaufsbudget pro Woche</h2>
    <div><button class="chip ${S.mitErwartet ? 'on' : ''}" data-a="erwartet">${S.mitErwartet ? 'Mit erwarteten Einnahmen' : 'Nur Geld, das schon da ist'}</button></div>
    <div class="big amt">${eur(E.wochenbudget)}<small> / Woche</small></div>
    <div class="small" style="display:flex;flex-direction:column;gap:6px">
      ${w ? `<p><b>Diese Woche geplant: ${eur(w.betrag)} für Einkäufe</b>${w.ausgegeben ? `, davon ${eur(w.ausgegeben)} ausgegeben` : ''}.</p>` : ''}
      ${lm ? `<p class="muted">${eur(lm.budget)} eingeplant bis ${tm(E.zyklus.bis)} für ${esc(lm.name)}. Offene Zahlungen und der Sparbetrag sind berücksichtigt.</p>` : ''}
      ${deckung}
      ${S.mitErwartet && R.einOffen > 0 ? `<p class="muted">${eur(R.einOffen)} sind noch erwartet. Dieses Geld ist erst nach dem Eingang verfügbar.</p>` : ''}
    </div>
    <details class="how"><summary>So wird gerechnet</summary><div style="padding-top:8px">
      <div class="kv"><span class="k">${S.mitErwartet ? 'Voraussichtlich übrig' : 'Jetzt da − offene Zahlungen − Sparen'}</span><span class="amt">${eurOderStrich(basis)}</span></div>
      ${R.bereiche.map(b => `<div class="kv"><span class="k">− ${esc(b.name)}, noch frei</span><span class="amt">${eur(Math.max(0, b.frei))}</span></div>`).join('')}
      <div class="kv total"><span class="k">= Puffer</span><span class="amt">${eurOderStrich(R.puffer)}</span></div>
      <p class="small muted">Das Wochenbudget gilt für 7 Tage. Kürzere Wochen am Anfang und Ende des Zyklus bekommen ihren Anteil: Tage ÷ 7 × Wochenbudget.</p></div></details>
    <label class="f" for="wochenbudget">Einkaufsbudget pro Woche (€)<input id="wochenbudget" class="amt-in" inputmode="decimal" value="${amtIn(E.wochenbudget)}" ${S.nurLesen ? 'disabled' : ''}></label>
    ${S.nurLesen ? '' : `<div class="btn-row"><button class="btn primary" data-a="wochenbudget">Wochenbudget speichern</button></div>`}
    <div class="weeks">${R.wochen.filter(x => !x.vorbei || x.ausgegeben).map(x => `<div class="week ${x.jetzt ? 'now' : ''}"><div style="min-width:0"><div class="wn">${x.jetzt ? 'Diese Woche' : 'Woche ' + x.nr}</div>
      <div class="small muted">${tm(x.von)} – ${tm(x.bis)} · ${x.vorbei ? 'vorbei' : `noch ${x.nochTage} Tag${x.nochTage === 1 ? '' : 'e'}`}</div>
      <div class="small muted amt">${eur(x.ausgegeben)} von ${eur(x.betrag)} ausgegeben</div>${x.jetzt && x.rest > 0 && x.nochTage > 0 ? `<div class="small amt">etwa ${eur(x.rest / x.nochTage)} pro Tag</div>` : ''}</div>
      <div class="wa amt ${x.rest < 0 ? 'danger' : ''}">${eurS(x.rest)}</div></div>`).join('')}</div>
    <p class="small muted">Neue Einkäufe, Einnahmen und Zahlungen ändern euren Wochenplan sofort.</p></div>
  ${schnellKarte(R)}
  <div class="card"><div class="card-h"><h2>Deine Alltagsbudgets</h2><span class="muted small amt">${eur(R.alltag)} genutzt</span></div>
    <div>${budgetListe(R, true)}</div>
    ${S.nurLesen ? '' : `<div><button class="btn" data-a="bereich-neu">+ Bereich hinzufügen</button></div>`}</div>
  <div class="card"><div class="card-h"><h2>Zum Sparen einplanen</h2></div>
    <label class="f" for="sparbetrag">Pro Gehaltszyklus (€)<input id="sparbetrag" class="amt-in" inputmode="decimal" value="${amtIn(E.sparbetrag)}" data-a="sparbetrag" ${S.nurLesen ? 'disabled' : ''}></label>
    <p class="small muted">Dieser Betrag ist im Monatsplan fest reserviert.</p>

function verlauf(R, kopf) {
  const tage = {};
  [...R.aus].sort((a, b) => b.datum.localeCompare(a.datum) || String(b.erstellt).localeCompare(String(a.erstellt))).forEach(b => { (tage[b.datum] = tage[b.datum] || []).push(b); });
  const bnamen = Object.fromEntries(bereiche().map(b => [b.id, b.name]));
  const zyk = [...S.zyklen].sort((a, b) => String(b.von).localeCompare(String(a.von)));
  const balken = (liste) => { const max = Math.max(...liste.map(x => x.s), 0.01); return `<div class="hbars">${liste.map(x => `<div class="hbar"><span class="nm" title="${esc(x.name)}">${esc(x.name)}</span><div class="prog"><i style="width:${(x.s / max * 100).toFixed(1)}%"></i></div><b class="amt">${eur(x.s)}</b></div>`).join('')}</div>`; };
  const personen = ['p1', 'p2'].map(p => { const a = R.aus.filter(b => (b.von || 'p1') === p); return { name: `${name(p)} · ${a.length}×`, s: summe(a) }; });
  const proBereich = R.bereiche.filter(b => b.ausgegeben > 0).map(b => ({ name: b.name, s: b.ausgegeben })).sort((a, b) => b.s - a.s);
  const orte = {}; R.aus.filter(b => (b.titel || '').trim()).forEach(b => { const k = b.titel.trim().toLowerCase(); (orte[k] = orte[k] || { name: b.titel.trim(), s: 0, n: 0 }); orte[k].s += Number(b.betrag) || 0; orte[k].n++; });
  const topOrte = Object.values(orte).sort((a, b) => b.s - a.s).slice(0, 5).map(o => ({ name: `${o.name} · ${o.n}×`, s: r2(o.s) }));
  return kopf('Euer Ausgabenverlauf.', 'Alle Alltagsausgaben in diesem Gehaltszyklus.') + `
  ${R.aus.length ? `<div class="card"><h2>Wer gibt wofür aus?</h2>
    <div><h3 style="padding-bottom:8px">Nach Person</h3>${balken(personen)}</div>
    ${proBereich.length ? `<div><h3 style="padding-bottom:8px">Nach Bereich</h3>${balken(proBereich)}</div>` : ''}
    ${topOrte.length ? `<div><h3 style="padding-bottom:8px">Wo am meisten</h3>${balken(topOrte)}</div>` : ''}</div>` : ''}
  <div class="card"><div class="card-h"><h2>Ausgaben in diesem Zyklus</h2><b class="amt">${eur(R.alltag)}</b></div>
    ${Object.keys(tage).length ? Object.entries(tage).map(([d, bs]) => `<div><div class="small muted" style="padding-top:6px">${tmj(d)} · ${eur(summe(bs))}</div><div class="rows">${bs.map(b => `
      <div class="row tap" data-a="bearbeiten" data-id="${esc(b.id)}" role="button" tabindex="0"><div class="l"><div class="tx"><div class="tt">${esc(b.titel || bnamen[b.bereich] || 'Ausgabe')}</div><div class="sub">${esc(bnamen[b.bereich] || 'gelöschter Bereich')}${b.von ? ' · ' + esc(name(b.von)) : ''} · ${b.quelle === 'bar' ? 'bar' : 'Konto'}</div></div></div>
      <div class="r amt"><b>${eur(b.betrag)}</b></div></div>`).join('')}</div></div>`).join('') : '<p class="muted">Noch keine Ausgaben eingetragen.</p>'}</div>
  <div class="card"><div class="card-h"><h2>Abgeschlossene Monate</h2></div>
    ${zyk.length ? `<div class="rows">${zyk.map(z => `<div class="row tap" data-a="zyklus-bearbeiten" data-id="${esc(z.id)}" role="button" tabindex="0"><div class="l"><div class="tx"><div class="tt">${tm(z.von)} – ${tmj(z.bis)}</div>
      <div class="sub amt">Einnahmen ${eur(z.einnahmen)} · Rechnungen ${eur(z.rechnungen)} · Alltag ${eur(z.alltag)}${z.gespart ? ' · gespart ' + eur(z.gespart) : ''}</div>${z.notiz ? `<div class="sub">${esc(z.notiz)}</div>` : ''}</div></div>
      <div class="r"><div class="sub">Endstand</div><b class="amt">${eurOderStrich(z.endstand)}</b></div></div>`).join('')}</div>` : '<p class="muted">Noch keine abgeschlossenen Monate.</p>'}</div>`;
}

function naechstesEnde(E) {
  const von = ausIso(plusTage(E.zyklus.bis, 1));
  const tag = ausIso(E.zyklus.von).getDate();
  const d = new Date(von.getFullYear(), von.getMonth() + 1, 1, 12);
  d.setDate(Math.min(tag, tageImMonat(d.getFullYear(), d.getMonth() + 1)));
  d.setDate(d.getDate() - 1);
  return isoTag(d);
}

/* ───────── Eingabefenster ───────── */
function oeffne(html, onSubmit) {
  const v = $('#veil');
  v.innerHTML = `<form class="sheet" id="sheet" novalidate>${html}<p class="small danger" id="f-fehler" hidden></p></form>`;
  v.hidden = false;
  const form = $('#sheet');
  form.addEventListener('submit', async ev => {
    ev.preventDefault();
    const fehler = $('#f-fehler'); fehler.hidden = true;
    const btn = form.querySelector('button[type="submit"]'); if (btn) btn.disabled = true;
    const msg = await onSubmit(form);
    if (btn) btn.disabled = false;
    if (msg) { fehler.textContent = msg; fehler.hidden = false; }
  });
  setTimeout(() => { const f = form.querySelector('input:not([type="checkbox"]):not([type="date"])'); if (f && matchMedia('(pointer:fine)').matches) f.focus(); }, 30);
}
function schliesse() { const v = $('#veil'); v.hidden = true; v.innerHTML = ''; if (S.renderOffen) render(); }
const seg = (id, werte, aktiv) => `<div class="seg" role="group" id="${id}">${werte.map(([v, t]) => `<button type="button" data-seg="${id}" data-v="${v}" aria-pressed="${v === aktiv}">${t}</button>`).join('')}</div>`;
const segWert = id => $(`#${id} [aria-pressed="true"]`)?.dataset.v;
const fuss = (loeschen) => `<div class="btn-row" style="justify-content:space-between">${loeschen ? `<button type="button" class="btn danger-btn" data-a="loeschen-frage">Löschen</button>` : '<span></span>'}<span class="btn-row"><button type="button" class="btn" data-a="schliessen">Abbrechen</button><button type="submit" class="btn primary">Speichern</button></span></div>`;

function buchungFenster(art, b) {

  b = b || { art, datum: heute(), quelle: 'konto', von: vonWahl(), erledigt: art === 'ausgabe', bereich: 'lebensmittel' };
  art = b.art;
  const titel = { ausgabe: neu ? 'Neue Ausgabe' : 'Ausgabe', zahlung: neu ? 'Neue Zahlung' : 'Zahlung', einnahme: neu ? 'Neue Einnahme' : 'Einnahme' }[art];
  const bs = bereiche();
  oeffne(`<h2>${titel}</h2>
    <label class="f" for="f-betrag">Betrag (€)<input id="f-betrag" class="amt-in" inputmode="decimal" placeholder="0,00" value="${amtIn(b.betrag)}" required></label>
    ${art === 'ausgabe' ? `<div class="f">Bereich (antippen zum Ändern)${seg('f-bereich', bs.map(x => [x.id, esc(x.name)]), bs.some(x => x.id === b.bereich) ? b.bereich : bs[0]?.id)}</div>` : ''}
    <label class="f" for="f-titel">${art === 'ausgabe' ? 'Wofür? (freiwillig)' : 'Bezeichnung'}<input id="f-titel" type="text" value="${esc(b.titel || '')}" placeholder="${art === 'ausgabe' ? 'z. B. Billa' : art === 'zahlung' ? 'z. B. Strom Wien Energie' : 'z. B. Lohn November'}" ${art === 'ausgabe' ? '' : 'required'}></label>
    <div class="grid2"><label class="f" for="f-datum">${art === 'zahlung' ? 'Fällig am' : art === 'einnahme' ? 'Kommt am' : 'Datum'}<input id="f-datum" type="date" value="${b.datum}" required></label>
      <div class="f">${art === 'einnahme' ? 'Geht auf' : 'Bezahlt mit'}${seg('f-quelle', [['konto', art === 'einnahme' ? 'Konto' : 'Konto / Karte'], ['bar', 'Bar']], b.quelle || 'konto')}</div></div>
    <div class="f">Erfasst von${seg('f-von', [['p1', esc(E.namen.p1)], ['p2', esc(E.namen.p2)]], b.von || vonWahl())}</div>
    ${art !== 'ausgabe' ? `<label class="check"><input type="checkbox" id="f-erledigt" ${b.erledigt ? 'checked' : ''}><span>${art === 'einnahme' ? 'Ist schon eingegangen' : 'Ist schon bezahlt'}</span></label>` : ''}
    ${art === 'einnahme' ? `<label class="check"><input type="checkbox" id="f-monatlich" ${b.monatlich ? 'checked' : ''}><span>Kommt jeden Monat (beim neuen Zyklus wieder als erwartet anlegen)</span></label>` : ''}
    ${b.vomVormonat ? '<p class="small warn-text">Der Betrag ist vom Vormonat übernommen. Bitte mit dem Lohnzettel vergleichen und speichern.</p>' : ''}
    ${b.fixId ? '<p class="small muted">Aus den Fixkosten übernommen.</p>' : ''}
    ${fuss(!neu)}`, async form => {

      const datum = $('#f-datum').value; if (!/^\d{4}-\d{2}-\d{2}$/.test(datum)) return 'Bitte ein Datum wählen.';
      const erledigt = art === 'ausgabe' ? true : $('#f-erledigt').checked;
      const daten = { ...stripMeta(b), art, betrag, titel: t, datum, quelle: segWert('f-quelle') || 'konto', von: segWert('f-von') || vonWahl(), erledigt, geaendert: jetztIso() };
      if (art === 'ausgabe') daten.bereich = segWert('f-bereich') || 'sonstiges';
      if (art === 'einnahme') { daten.monatlich = $('#f-monatlich').checked; daten.vomVormonat = false; }
      if (erledigt && (neu || !b.erledigt)) daten.erledigtAm = jetztIso();
      if (!erledigt) daten.erledigtAm = null;

      if (ok) schliesse(); return ok ? '' : 'Nicht gespeichert. Bitte nochmal versuchen.';
    });
  $('#sheet').dataset.loeschen = neu ? '' : 'buchungen/' + b.id;

function stripMeta(o) { const { id, ...rest } = o || {}; return rest; }

function fixFenster(f) {
  const neu = !f; const E = einst();
  f = f || { tag: 1, rhythmus: 1, kategorie: 'Wohnen', quelle: 'konto', aktiv: true, startMonat: E.zyklus.von.slice(0, 7) };
  oeffne(`<h2>${neu ? 'Neue Fixkosten' : 'Fixkosten'}</h2>
    <label class="f" for="f-titel">Bezeichnung<input id="f-titel" type="text" value="${esc(f.titel || '')}" placeholder="z. B. Miete, Wiener Linien, Kredit" required></label>

    <label class="check"><input type="checkbox" id="f-aktiv" ${f.aktiv !== false ? 'checked' : ''}><span>Aktiv (läuft noch)</span></label>
    <p class="small muted">${neu ? 'Wird gleich als Zahlung für diesen Zyklus übernommen, wenn sie in diesem Zyklus fällig ist.' : 'Änderungen gelten auch für die offene Zahlung dieses Zyklus. Löschen entfernt die offene Zahlung dieses Zyklus mit; bezahlte bleiben im Verlauf.'}</p>
    ${fuss(!neu)}`, async () => {
      const betrag = parseEuro($('#f-betrag').value);

      const daten = { ...stripMeta(f), titel, betrag, tag, rhythmus, startMonat, kategorie: $('#f-kat').value, quelle: segWert('f-quelle') || 'konto', aktiv: $('#f-aktiv').checked, geaendert: jetztIso() };
      const ref = neu ? S.db.collection('fixkosten').doc() : S.db.doc('fixkosten/' + f.id);
      const datumGeaendert = !neu && (Number(f.tag) !== tag || Number(f.rhythmus) !== rhythmus || f.startMonat !== startMonat);

      if (ok) { schliesse(); toast(neu ? (n ? 'Gespeichert und für diesen Zyklus übernommen' : 'Fixkosten gespeichert') : 'Fixkosten geändert'); }

/* Eine Fixkosten-Zeile in einen Zyklus bringen: fehlende Zahlung anlegen, offene angleichen */
async function fixInZyklus(f, E, datumGeaendert) {
  const st = fixStand(f, E); let n = 0;
  for (const b of st.linked) {
    if (b.erledigt) continue;
    if (!st.dats.length) { if (b.fixId === f.id) await S.db.doc('buchungen/' + b.id).delete(); continue; }
    const patch = {};
    if (b.fixId !== f.id) patch.fixId = f.id;
    if (b.titel !== f.titel) patch.titel = f.titel;
    if (r2(b.betrag) !== r2(f.betrag)) patch.betrag = r2(f.betrag);
    if ((b.quelle || 'konto') !== (f.quelle || 'konto')) patch.quelle = f.quelle || 'konto';
    if (datumGeaendert && st.dats.length === 1 && b.datum !== st.dats[0]) patch.datum = st.dats[0];
    if (Object.keys(patch).length) await S.db.doc('buchungen/' + b.id).update({ ...patch, geaendert: jetztIso() });
  }
  for (const d of st.fehlend) {
    await S.db.collection('buchungen').doc().set({ art: 'zahlung', titel: f.titel, betrag: r2(f.betrag), datum: d, quelle: f.quelle || 'konto', fixId: f.id, von: vonWahl(), erledigt: false, erledigtAm: null, erstellt: jetztIso(), geaendert: jetztIso() });
    n++;
  }
  return n;
}
async function fixUebernehmen() {

async function zyklusAbschliessen() {

  const neuVon = plusTage(E.zyklus.bis, 1), neuBis = naechstesEnde(E);
  let n = 0, nEin = 0;

    await S.db.collection('zyklen').doc().set({ von: E.zyklus.von, bis: E.zyklus.bis, einnahmen: R.einErhalten, rechnungen: R.zahBezahlt, alltag: R.alltag, gespart: R.sparErledigt, endstand: R.jetzt, offenUebernommen: R.zahOffen, notiz: R.zahOffen ? `${eur(R.zahOffen)} Zahlungen waren noch offen` : '', geaendert: jetztIso() });
    const snap = await einstRef().get();

    await einstRef().set({ ...alt, zyklus: { von: neuVon, bis: neuBis }, gespartVorher: r2((Number(alt.gespartVorher) || 0) + R.sparErledigt), sparUeberwiesen: false, sparAm: null, geaendert: jetztIso() });
    const E2 = { zyklus: { von: neuVon, bis: neuBis } };

      await S.db.collection('buchungen').doc().set({ art: 'einnahme', titel, betrag: r2(b.betrag), datum, quelle: b.quelle || 'konto', von: b.von || vonWahl(), monatlich: true, vomVormonat: true, erledigt: false, erledigtAm: null, erstellt: jetztIso(), geaendert: jetztIso() });

  if (ok) { toast(`Neuer Zyklus: ${tm(neuVon)} – ${tmj(neuBis)} · ${n} Fixkosten${nEin ? `, ${nEin} Einnahme${nEin === 1 ? '' : 'n'}` : ''} übernommen`); location.hash = '#uebersicht'; }
}

function importPruefen(inhalt) {
  let d;
  try { d = JSON.parse(inhalt); }
  catch {
    const von = inhalt.indexOf('{'), bis = inhalt.lastIndexOf('}');
    try { d = JSON.parse(inhalt.slice(von, bis + 1)); } catch { throw 'kein-format'; }
  }
  if (!d || typeof d !== 'object' || !Array.isArray(d.buchungen)) throw 'In der Datei sind keine Buchungen. Ist das die richtige Sicherung?';
  const karte = {}; let uebersprungen = 0;

  const nimm = (sammlung, liste, gueltig) => (Array.isArray(liste) ? liste : []).forEach(x => {
    if (!x || typeof x !== 'object' || !idOk(x.id) || !gueltig(x)) { uebersprungen++; return; }
    const { id, ...rest } = x; karte[`${sammlung}/${id}`] = rest;
  });
  nimm('buchungen', d.buchungen, b => ['einnahme', 'zahlung', 'ausgabe'].includes(b.art) && typeof b.datum === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(b.datum) && isFinite(Number(b.betrag)));
  nimm('fixkosten', d.fixkosten, f => typeof f.titel === 'string' && isFinite(Number(f.betrag)));
  nimm('bereiche', d.bereiche, b => typeof b.name === 'string');
  nimm('zyklen', d.zyklen, z => typeof z.von === 'string' && typeof z.bis === 'string');
  if (d.einstellungen && typeof d.einstellungen === 'object') karte['haushalt/einstellungen'] = d.einstellungen;
  const n = pre => Object.keys(karte).filter(k => k.startsWith(pre + '/')).length;
  const e = d.einstellungen || {};
  const text = `${n('buchungen')} Buchungen, ${n('fixkosten')} Fixkosten, ${n('bereiche')} eigene Bereiche, ${n('zyklen')} abgeschlossene Monate`
    + (e.namen ? ` · ${esc(e.namen.p1 || '')} &amp; ${esc(e.namen.p2 || '')}` : '')
    + (e.zyklus && e.zyklus.von && e.zyklus.bis ? ` · Zyklus ${tm(e.zyklus.von)} – ${tmj(e.zyklus.bis)}` : '')

}

  try { daten = JSON.parse(localStorage.getItem(SPEICHER_KEY) || '{}') || {}; } catch { daten = {}; }
  const hoerer = new Set();
  const kopie = v => v == null ? v : JSON.parse(JSON.stringify(v));
  const melden = () => setTimeout(() => hoerer.forEach(f => f()), 0);
  function sichern(rueckgaengig) {
    try { localStorage.setItem(SPEICHER_KEY, JSON.stringify(daten)); }
    catch (e) { rueckgaengig(); throw { code: 'quota_exceeded' }; }
    melden();
  }
  let zaehler = 0;
  const neueId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8) + (zaehler++).toString(36);
  const snapDoc = p => ({ id: p.split('/').pop(), exists: p in daten, data: () => kopie(daten[p]) });
  const doc = p => ({
    id: p.split('/').pop(), path: p,
    get: async () => snapDoc(p),
    set: async d => { const alt = daten[p]; daten[p] = kopie(d); sichern(() => { if (alt === undefined) delete daten[p]; else daten[p] = alt; }); },
    update: async d => { if (!(p in daten)) throw { code: 'invalid_argument' }; const alt = daten[p]; daten[p] = { ...alt, ...kopie(d) }; sichern(() => { daten[p] = alt; }); },
    delete: async () => { if (!(p in daten)) return; const alt = daten[p]; delete daten[p]; sichern(() => { daten[p] = alt; }); },
    onSnapshot: next => { const f = () => next(snapDoc(p)); hoerer.add(f); setTimeout(f, 0); return () => hoerer.delete(f); },
  });
  const collection = c => ({
    path: c,
    doc: id => doc(c + '/' + (id || neueId())),
    onSnapshot: next => {
      const f = () => { const tiefe = c.split('/').length + 1; const docs = Object.keys(daten).filter(k => k.startsWith(c + '/') && k.split('/').length === tiefe).map(snapDoc); next({ docs, size: docs.length, empty: !docs.length }); };
      hoerer.add(f); setTimeout(f, 0); return () => hoerer.delete(f);
    },
  });
  const ersetzen = async neu => { const alt = daten; daten = kopie(neu); sichern(() => { daten = alt; }); };
  // Zweiter Tab offen? Dann dort die Änderungen übernehmen.
  window.addEventListener('storage', e => { if (e.key === SPEICHER_KEY) { try { daten = JSON.parse(e.newValue || '{}') || {}; } catch { daten = {}; } melden(); } });
  return { doc, collection, ersetzen };
}
/* Datei an das Gerät geben: am iPhone über das Teilen-Menü („In Dateien sichern“), sonst als Download */
const geraetDownloads = {
  save: async ({ filename, data }) => {
    const typ = filename.endsWith('.csv') ? 'text/csv;charset=utf-8' : 'application/json';
    const datei = typeof File === 'function' ? new File([data], filename, { type: typ }) : null;
    if (datei && navigator.canShare && navigator.canShare({ files: [datei] })) {
      try { await navigator.share({ files: [datei], title: filename }); return { status: 'saved' }; }
      catch (e) { if (e && e.name === 'AbortError') throw { code: 'declined' }; }
    }
    const url = URL.createObjectURL(new Blob([data], { type: typ }));
    const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
    return { status: 'saved' };
  },
};

/* ───────── Start ───────── */
render();
(() => {
  let db = null;
  try { localStorage.setItem('hb_probe', '1'); localStorage.removeItem('hb_probe'); db = lokalerSpeicher(); } catch { db = null; }
  S.downloads = geraetDownloads; S.kannSchreiben = true;
  if (!db) { S.verfuegbar = false; S.nurLesen = true; Object.keys(S.geladen).forEach(k => S.geladen[k] = true); zeigeSync(); render(); return; }
  S.db = db; S.verfuegbar = true;
  zeigeSync();
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  const liste = snap => snap.docs.map(d => ({ id: d.id, ...d.data() }));
  db.doc('haushalt/einstellungen').onSnapshot(s => { S.einst = s.exists ? s.data() : null; S.geladen.einst = true; render(); });
  db.collection('buchungen').onSnapshot(s => { S.buchungen = liste(s).filter(b => b.datum); S.geladen.buchungen = true; render(); });
  db.collection('fixkosten').onSnapshot(s => { S.fix = liste(s); S.geladen.fix = true; render(); });
  db.collection('bereiche').onSnapshot(s => { S.bereiche = liste(s); S.geladen.bereiche = true; render(); });
  db.collection('zyklen').onSnapshot(s => { S.zyklen = liste(s); S.geladen.zyklen = true; render(); });
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
